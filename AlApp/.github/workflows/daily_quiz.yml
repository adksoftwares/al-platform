name: Daily Quiz Generator

on:
  schedule:
    # 18:30 UTC = 00:00 Sri Lanka time (UTC+05:30).
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-quiz-generator
  cancel-in-progress: false

jobs:
  generate_quizzes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [tamil, sinhala, english]
        subject: [biology, chemistry, physics]
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout subject materials
        uses: actions/checkout@v4
        with:
          repository: adksoftwares/subjects-materials
          path: subjects-materials
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: AlApp/scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r AlApp/scripts/requirements.txt google-genai

      - name: Generate and upload quiz
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python AlApp/scripts/generate_and_upload_quizzes.py
          --base ./subjects-materials/subjects
          --lang "${{ matrix.language }}"
          --sub "${{ matrix.subject }}"
          --db https://al-students-default-rtdb.asia-southeast1.firebasedatabase.app
