name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm test

  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Report all dependency advisories
        continue-on-error: true
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          node -e "const a=require('/tmp/npm-audit-all.json'); console.log(JSON.stringify(Object.entries(a.vulnerabilities || {}).map(([name,v]) => ({name,severity:v.severity,dev:v.isDirect ? false : undefined,fixAvailable:v.fixAvailable,via:v.via.map(x => typeof x === 'string' ? x : x.title)})), null, 2))"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AlApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon assembleDebug -PbackendBaseUrl=https://api.example.invalid

  firebase-rules:
    name: Validate Firebase rules JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test AlApp/database.rules.test.js
      - run: node -e "JSON.parse(require('node:fs').readFileSync('AlApp/database.rules.json', 'utf8')); console.log('Firebase rules JSON is valid')"
