name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git show HEAD:backend/package-lock.json > /tmp/original-backend-lock.json
      - run: npm install
      - name: Inspect patched backend lock entries
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const oldLock = JSON.parse(fs.readFileSync('/tmp/original-backend-lock.json'));
          const nextLock = JSON.parse(fs.readFileSync('package-lock.json'));
          const keys = new Set([...Object.keys(oldLock.packages), ...Object.keys(nextLock.packages)]);
          const changed = [...keys]
            .filter((key) => JSON.stringify(oldLock.packages[key]) !== JSON.stringify(nextLock.packages[key]))
            .map((path) => ({ path, entry: nextLock.packages[path] }));
          console.log(JSON.stringify({ root: nextLock.packages[''], changed }, null, 2));
          NODE
      - run: npm audit --audit-level=high
      - run: npm test

  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Inspect patched build-tool lock entries
        continue-on-error: true
        run: |
          git show HEAD:web/package-lock.json > /tmp/original-lock.json
          npm update vite source-map-js --package-lock-only || true
          node -e "const fs=require('node:fs'); const old=JSON.parse(fs.readFileSync('/tmp/original-lock.json')); const next=JSON.parse(fs.readFileSync('package-lock.json')); const keys=new Set([...Object.keys(old.packages),...Object.keys(next.packages)]); console.log(JSON.stringify([...keys].filter(k=>JSON.stringify(old.packages[k])!==JSON.stringify(next.packages[k])).map(path=>({path,entry:next.packages[path]})),null,2))"
      - name: Report all dependency advisories
        continue-on-error: true
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          node -e "const a=require('/tmp/npm-audit-all.json'); console.log(JSON.stringify(Object.entries(a.vulnerabilities || {}).map(([name,v]) => ({name,severity:v.severity,dev:v.isDirect ? false : undefined,fixAvailable:v.fixAvailable,via:v.via.map(x => typeof x === 'string' ? x : x.title)})), null, 2))"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AlApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon assembleDebug -PbackendBaseUrl=https://api.example.invalid

  firebase-rules:
    name: Validate Firebase rules JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test AlApp/database.rules.test.js
      - run: node -e "JSON.parse(require('node:fs').readFileSync('AlApp/database.rules.json', 'utf8')); console.log('Firebase rules JSON is valid')"
